name: Luck Society Backtest

on:
  workflow_dispatch:

concurrency:
  group: backtest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Replay the trigger on two years of history
        run: python scanner/backtest.py
      - name: Publish
        run: |
          if [ -z "$(git status --porcelain data/backtest)" ]; then echo "nothing to publish"; exit 0; fi
          git config user.name "luck-society-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest
          git commit -q -m "backtest: $(date -u '+%F %H:%M') UTC"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase -X theirs && git push -q; then echo "published on attempt $i"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          echo "could not publish"; exit 1
