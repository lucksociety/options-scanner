name: Luck Society Morning Brief

on:
  schedule:
    - cron: "30 12 * * 1-5"   # 8:30 am ET during daylight time (EDT)
    - cron: "45 12 * * 1-5"   # fallback — GitHub often skips the first cron; script exits 3 if today is already posted
    - cron: "30 13 * * 1-5"   # 8:30 am ET during standard time (Nov–Mar); harmless 9:30 EDT fallback otherwise
    - cron: "40 21 * * 1-5"   # 5:40 pm EDT / 4:40 pm EST — after the close, scorecard
  workflow_dispatch:
    inputs:
      mode:
        description: "brief = post this morning's picks · score = grade today's picks"
        type: choice
        default: brief
        options: [brief, score]

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Decide mode
        id: mode
        run: |
          if [ -n "${{ inputs.mode }}" ]; then echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=America/New_York date +%H)" -ge 15 ]; then echo "mode=score" >> "$GITHUB_OUTPUT"
          else echo "mode=brief" >> "$GITHUB_OUTPUT"; fi
      - name: Run
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MORNING_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}   # any manual run is intentional
        run: |
          rc=0; python scanner/morning.py "${{ steps.mode.outputs.mode }}" || rc=$?
          if [ "$rc" = "3" ]; then echo "nothing to do"; exit 0; fi
          exit $rc
      - name: Publish
        run: |
          if [ -z "$(git status --porcelain data)" ]; then echo "no new results"; exit 0; fi
          git config user.name "luck-society-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "morning: $(date -u '+%F %H:%M') UTC"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs && git push; then echo "published on attempt $i"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          echo "could not publish after 5 attempts"; exit 1
