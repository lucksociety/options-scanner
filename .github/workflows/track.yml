name: Luck Society Track Record

on:
  schedule:
    - cron: "40 21 * * 1-5"   # 5:40 pm ET (EDT) after the close, weekdays
  workflow_dispatch:

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Score past picks
        run: python scanner/track.py
      - name: Publish
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "luck-society-scanner-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data
            git commit -m "track: $(date -u '+%F %H:%M') UTC"
            git pull --rebase
            git push
          else
            echo "no new results"
          fi

