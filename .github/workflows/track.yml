name: Luck Society Track Record

on:
  schedule:
    - cron: "40 21 * * 1-5"   # 5:40 pm ET (EDT) after the close, weekdays
  workflow_dispatch:

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Score past picks
        run: python scanner/track.py
      - name: Publish
        run: |
          if [ -z "$(git status --porcelain data)" ]; then echo "no new results"; exit 0; fi
          git config user.name "luck-society-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "track: $(date -u '+%F %H:%M') UTC"
          # data/ is generated output: on a conflict the fresher scan always wins ("theirs" = the commit being replayed)
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs && git push; then echo "published on attempt $i"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          echo "could not publish after 5 attempts"; exit 1
