name: Luck Society Option Scanner

# One full scan per trading day, before the open. 8:35 am ET is the sweet spot: yesterday's bar is complete
# (so "closed in the top of its range" means the real close), IBKR borrow data has rolled overnight, Yahoo's
# pre-market quote is live, and the board is ready before 9:30. GitHub honours only some cron triggers on a
# free repo, so a second trigger at 9:05 is a fallback — the script exits at once if today's scan exists.
on:
  schedule:
    - cron: "35 12 * * 1-5"   # 8:35 am ET during EDT (7:35 am in winter — still pre-market)
    - cron: "5 13 * * 1-5"    # 9:05 am ET fallback; no-op if the 8:35 run published
  workflow_dispatch:
    inputs:
      mode:
        description: "full = new screen + deep scan · refresh = re-quote current names"
        type: choice
        default: full
        options: [full, refresh]

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan
        env:
          MODE: ${{ inputs.mode || 'daily' }}
        run: |
          rc=0; python scanner/scan.py "$MODE" both || rc=$?
          if [ "$rc" = "3" ]; then echo "nothing to do"; exit 0; fi
          exit $rc
      - name: Publish results
        run: |
          if [ -z "$(git status --porcelain data)" ]; then echo "no new results"; exit 0; fi
          git config user.name "luck-society-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -q -m "scan: $(date -u '+%F %H:%M') UTC"
          # data/ is generated output: on a conflict the fresher scan always wins ("theirs" = the commit being replayed)
          for i in 1 2 3 4 5; do
            if git pull -q --rebase -X theirs && git push -q; then echo "published on attempt $i"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          echo "could not publish after 5 attempts"; exit 1
