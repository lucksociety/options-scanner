name: Luck Society Option Scanner

on:
  schedule:
    - cron: "*/5 12-21 * * 1-5"   # every 5 min, weekdays; script only works 08:25–16:10 ET
  workflow_dispatch:
    inputs:
      mode:
        description: "full = new screen + deep scan · refresh = re-quote current names"
        type: choice
        default: full
        options: [full, refresh]

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scanner
        run: python scanner/scan.py "${{ inputs.mode || 'auto' }}" both
      - name: Publish results
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "luck-society-scanner-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data
            git commit -m "scan: $(date -u '+%F %H:%M') UTC"
            git pull --rebase
            git push
          else
            echo "no new results"
          fi

