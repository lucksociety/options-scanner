name: Luck Society Option Scanner

on:
  schedule:
    - cron: "*/5 12-21 * * 1-5"   # every 5 min, weekdays; script only works 08:25–16:10 ET
  workflow_dispatch:
    inputs:
      mode:
        description: "full = new screen + deep scan · refresh = re-quote current names"
        type: choice
        default: full
        options: [full, refresh]

concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scanner
        run: python scanner/scan.py "${{ inputs.mode || 'auto' }}" both
      - name: Discord alerts
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scanner/alerts.py
      - name: Publish results
        run: |
          if [ -z "$(git status --porcelain data)" ]; then echo "no new results"; exit 0; fi
          git config user.name "luck-society-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "scan: $(date -u '+%F %H:%M') UTC"
          # data/ is generated output: on a conflict the fresher scan always wins ("theirs" = the commit being replayed)
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs && git push; then echo "published on attempt $i"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 5))
          done
          echo "could not publish after 5 attempts"; exit 1
